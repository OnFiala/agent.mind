name: Verify package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run package
      - run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/smoke-release.mjs "dist/agent-mind-${version}/agent-mind-${version}"
      - name: Upgrade and rollback from published 1.0.3
        run: |
          previous="$RUNNER_TEMP/agent-mind-previous"
          mkdir "$previous"
          curl --fail --location --retry 2 --output "$previous/agent-mind-1.0.3.tar.gz" https://github.com/OnFiala/agent.mind/releases/download/v1.0.3/agent-mind-1.0.3.tar.gz
          echo "f975965f925806518180c8222978d4b3804a6244751401800af7d446e7dcb225  $previous/agent-mind-1.0.3.tar.gz" | sha256sum --check
          tar -xzf "$previous/agent-mind-1.0.3.tar.gz" -C "$previous"
          version="$(node -p "require('./package.json').version")"
          node scripts/smoke-upgrade.mjs "$previous/agent-mind-1.0.3" "$PWD/dist/agent-mind-${version}/agent-mind-${version}"
      - name: Upgrade and rollback from published 1.1.0
        run: |
          previous="$RUNNER_TEMP/agent-mind-previous-1.1.0"
          mkdir "$previous"
          curl --fail --location --retry 2 --output "$previous/agent-mind-1.1.0.tar.gz" https://github.com/OnFiala/agent.mind/releases/download/v1.1.0/agent-mind-1.1.0.tar.gz
          echo "9fa1132f22e69a0b4d66d609b99d225ad209ce1c97e99e5782a878343a665f24  $previous/agent-mind-1.1.0.tar.gz" | sha256sum --check
          tar -xzf "$previous/agent-mind-1.1.0.tar.gz" -C "$previous"
          version="$(node -p "require('./package.json').version")"
          node scripts/smoke-upgrade.mjs "$previous/agent-mind-1.1.0" "$PWD/dist/agent-mind-${version}/agent-mind-${version}"
      - name: Upgrade and rollback from published 1.2.0
        run: |
          previous="$RUNNER_TEMP/agent-mind-previous-1.2.0"
          mkdir "$previous"
          curl --fail --location --retry 2 --output "$previous/agent-mind-1.2.0.tar.gz" https://github.com/OnFiala/agent.mind/releases/download/v1.2.0/agent-mind-1.2.0.tar.gz
          echo "8340c3f70801c3b09fe9c5f9a7a7b66d77008f7738c2b489e686a041d9b4f6c4  $previous/agent-mind-1.2.0.tar.gz" | sha256sum --check
          tar -xzf "$previous/agent-mind-1.2.0.tar.gz" -C "$previous"
          version="$(node -p "require('./package.json').version")"
          node scripts/smoke-upgrade.mjs "$previous/agent-mind-1.2.0" "$PWD/dist/agent-mind-${version}/agent-mind-${version}"
      - name: Upgrade and rollback from published 1.2.1
        run: |
          previous="$RUNNER_TEMP/agent-mind-previous-1.2.1"
          mkdir "$previous"
          curl --fail --location --retry 2 --output "$previous/agent-mind-1.2.1.tar.gz" https://github.com/OnFiala/agent.mind/releases/download/v1.2.1/agent-mind-1.2.1.tar.gz
          echo "fa1401d3c5fc910c77b9931da8ab64e1d1ec7ef10be72dfd86f65fb696bba2fc  $previous/agent-mind-1.2.1.tar.gz" | sha256sum --check
          tar -xzf "$previous/agent-mind-1.2.1.tar.gz" -C "$previous"
          version="$(node -p "require('./package.json').version")"
          node scripts/smoke-upgrade.mjs "$previous/agent-mind-1.2.1" "$PWD/dist/agent-mind-${version}/agent-mind-${version}"
